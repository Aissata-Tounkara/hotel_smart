name: hotel_smart
description: "Hotel Smart - Application de gestion hoteliere (Admin, Receptionniste, Client)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Base de donnees locale
  sqflite: ^2.4.1
  path: ^1.9.1

  # Reseau / API REST
  http: ^1.2.2

  # Gestion d'etat
  provider: ^6.1.2

  # Persistance legere (session utilisateur, preferences)
  shared_preferences: ^2.3.3

  # Indicateurs de chargement
  flutter_spinkit: ^5.2.1

  # Formatage dates / nombres (i18n)
  intl: ^0.20.2

  # Hachage du mot de passe (SHA-256)
  crypto: ^3.0.6

  # Notifications locales (check-in / check-out)
  flutter_local_notifications: ^18.0.1

  # Graphiques du tableau de bord / statistiques
  fl_chart: ^0.70.2

  # Fuseaux horaires (requis par flutter_local_notifications pour les rappels programmes)
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Typographie signature du design premium (Playfair Display / Manrope),
  # embarquee localement plutot que chargee a la volee (fiabilite hors-ligne,
  # meme principe que la migration de l'API des nationalites).
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 500
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 700
